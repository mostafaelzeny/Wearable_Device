<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wearable Vitals Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #687385;
      --line: #dce3ed;
      --bpm: #c9364f;
      --spo2: #187f8f;
      --ok: #168a52;
      --warn: #b98500;
      --bad: #b42318;
      --shadow: 0 14px 34px rgba(22, 31, 46, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.9), rgba(246,248,251,0.85)),
        repeating-linear-gradient(90deg, rgba(23,32,42,0.03) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(0deg, rgba(23,32,42,0.025) 0 1px, transparent 1px 72px);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .subhead {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
    }

    .connected .dot {
      background: var(--ok);
    }

    .offline .dot {
      background: var(--bad);
    }

    .controls {
      display: grid;
      grid-template-columns: 1.5fr 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 12px;
      color: var(--ink);
      background: #fbfcfe;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #7aa8b3;
      box-shadow: 0 0 0 3px rgba(24, 127, 143, 0.14);
    }

    button {
      align-self: end;
      height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 18px;
      color: white;
      background: #1f5f6c;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #194f5a;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .metric {
      min-height: 192px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .metric-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .metric-name {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .pill {
      padding: 5px 9px;
      border-radius: 999px;
      background: #edf2f7;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .value {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .number {
      font-size: clamp(58px, 9vw, 92px);
      line-height: 0.95;
      font-weight: 820;
      letter-spacing: 0;
    }

    .bpm .number {
      color: var(--bpm);
    }

    .spo2 .number {
      color: var(--spo2);
    }

    .unit {
      color: var(--muted);
      font-size: 22px;
      font-weight: 760;
    }

    .meta {
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .chart-panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .chart-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    canvas {
      width: 100%;
      height: 280px;
      display: block;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
    }

    @media (max-width: 760px) {
      header,
      .grid,
      .controls {
        grid-template-columns: 1fr;
      }

      header {
        align-items: stretch;
        flex-direction: column;
      }

      .status {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Wearable Vitals Dashboard</h1>
        <p class="subhead">MAX30102 live telemetry over MQTT</p>
      </div>
      <div id="status" class="status offline">
        <span class="dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <section class="controls">
      <div>
        <label for="brokerUrl">Broker WebSocket URL</label>
        <input id="brokerUrl" value="ws://localhost:9001">
      </div>
      <div>
        <label for="topic">Topic</label>
        <input id="topic" value="wearable/vitals">
      </div>
      <button id="connectBtn" type="button">Connect</button>
    </section>

    <section class="grid">
      <article class="metric bpm">
        <div class="metric-top">
          <div class="metric-name">Heart Rate</div>
          <div id="bpmState" class="pill">Waiting</div>
        </div>
        <div class="value">
          <div id="bpmValue" class="number">--</div>
          <div class="unit">BPM</div>
        </div>
        <div id="bpmMeta" class="meta">No recent sample</div>
      </article>

      <article class="metric spo2">
        <div class="metric-top">
          <div class="metric-name">Oxygen Saturation</div>
          <div id="spo2State" class="pill">Waiting</div>
        </div>
        <div class="value">
          <div id="spo2Value" class="number">--</div>
          <div class="unit">%</div>
        </div>
        <div id="spo2Meta" class="meta">Updates every 5 seconds</div>
      </article>
    </section>

    <section class="chart-panel">
      <div class="chart-head">
        <span>Live Trend</span>
        <span id="lastUpdate">No data</span>
      </div>
      <canvas id="trend" width="1100" height="280"></canvas>
    </section>
  </main>

  <script>
    const els = {
      status: document.getElementById('status'),
      statusText: document.getElementById('statusText'),
      brokerUrl: document.getElementById('brokerUrl'),
      topic: document.getElementById('topic'),
      connectBtn: document.getElementById('connectBtn'),
      bpmValue: document.getElementById('bpmValue'),
      spo2Value: document.getElementById('spo2Value'),
      bpmState: document.getElementById('bpmState'),
      spo2State: document.getElementById('spo2State'),
      bpmMeta: document.getElementById('bpmMeta'),
      spo2Meta: document.getElementById('spo2Meta'),
      lastUpdate: document.getElementById('lastUpdate'),
      trend: document.getElementById('trend')
    };

    let client = null;
    const points = [];
    const maxPoints = 90;

    function setStatus(text, state) {
      els.statusText.textContent = text;
      els.status.classList.remove('connected', 'offline');
      if (state) els.status.classList.add(state);
    }

    function classifyBpm(bpm) {
      if (!bpm) return ['Waiting', 'No valid heart-rate sample'];
      if (bpm < 50 || bpm > 120) return ['Check', 'Outside resting range'];
      return ['Live', 'Signal received'];
    }

    function classifySpo2(spo2) {
      if (!spo2) return ['Settling', 'Waiting for final SpO2'];
      if (spo2 < 92) return ['Low', 'Compare with reference oximeter'];
      return ['Final', '5-second SpO2 update'];
    }

    function drawChart() {
      const canvas = els.trend;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const pad = 34;

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#fbfcfe';
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = '#e5ebf2';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad + ((h - pad * 2) * i / 4);
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(w - pad, y);
        ctx.stroke();
      }

      drawSeries('bpm', '#c9364f', 40, 140);
      drawSeries('spo2', '#187f8f', 70, 100);

      ctx.fillStyle = '#687385';
      ctx.font = '13px system-ui';
      ctx.fillText('BPM', pad, 20);
      ctx.fillText('SpO2', pad + 54, 20);

      function drawSeries(key, color, min, max) {
        const valid = points.filter(p => p[key] > 0);
        if (valid.length < 2) return;

        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();

        valid.forEach((p, index) => {
          const x = pad + ((w - pad * 2) * points.indexOf(p) / Math.max(1, maxPoints - 1));
          const clamped = Math.max(min, Math.min(max, p[key]));
          const y = h - pad - ((clamped - min) / (max - min)) * (h - pad * 2);
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
      }
    }

    function updateVitals(payload) {
      const data = JSON.parse(payload);
      const bpm = Number(data.bpm || 0);
      const spo2 = Number(data.spo2 || 0);
      const finger = data.finger !== false;
      const now = new Date();

      els.bpmValue.textContent = bpm > 0 ? bpm : '--';
      els.spo2Value.textContent = spo2 > 0 ? spo2 : '--';
      els.lastUpdate.textContent = now.toLocaleTimeString();

      const [bpmState, bpmMeta] = classifyBpm(bpm);
      const [spo2State, spo2Meta] = classifySpo2(spo2);
      els.bpmState.textContent = finger ? bpmState : 'No Finger';
      els.spo2State.textContent = finger ? spo2State : 'No Finger';
      els.bpmMeta.textContent = finger ? bpmMeta : 'Place finger on sensor';
      els.spo2Meta.textContent = finger ? spo2Meta : 'Place finger on sensor';

      points.push({ bpm, spo2, time: now });
      while (points.length > maxPoints) points.shift();
      drawChart();
    }

    function connect() {
      const brokerUrl = els.brokerUrl.value.trim();
      const topic = els.topic.value.trim();
      localStorage.setItem('vitalsBrokerUrl', brokerUrl);
      localStorage.setItem('vitalsTopic', topic);

      if (client) {
        client.end(true);
        client = null;
      }

      setStatus('Connecting', 'offline');
      client = mqtt.connect(brokerUrl, {
        clientId: 'vitals-dashboard-' + Math.random().toString(16).slice(2),
        reconnectPeriod: 2000,
        connectTimeout: 5000
      });

      client.on('connect', () => {
        setStatus('Connected', 'connected');
        client.subscribe(topic);
      });

      client.on('reconnect', () => setStatus('Reconnecting', 'offline'));
      client.on('close', () => setStatus('Disconnected', 'offline'));
      client.on('error', () => setStatus('Connection error', 'offline'));

      client.on('message', (_topic, message) => {
        try {
          updateVitals(message.toString());
        } catch (error) {
          console.warn('Invalid MQTT payload', error);
        }
      });
    }

    els.brokerUrl.value = localStorage.getItem('vitalsBrokerUrl') || els.brokerUrl.value;
    els.topic.value = localStorage.getItem('vitalsTopic') || els.topic.value;
    els.connectBtn.addEventListener('click', connect);
    drawChart();
  </script>
</body>
</html>
